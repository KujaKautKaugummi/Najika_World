name: najika_digivice
description: Najika Digivice - Ultra-Secure Mobile App with Quantum-Safe Messaging
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ============================================================================
  # UI & DESIGN
  # ============================================================================
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  animations: ^2.0.11
  flutter_animate: ^4.3.0
  lottie: ^3.0.0

  # ============================================================================
  # STATE MANAGEMENT
  # ============================================================================
  provider: ^6.1.1
  get_it: ^7.6.4
  rxdart: ^0.27.7

  # ============================================================================
  # CRYPTOGRAPHY
  # ============================================================================

  # Classical Cryptography
  cryptography: ^2.7.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.7.4

  # Post-Quantum Cryptography
  # Note: These are placeholder package names - actual PQ crypto implementation
  # will be in custom Dart code using FFI bindings to liboqs
  ffi: ^2.1.0

  # Signal Protocol
  libsignal_protocol_dart: ^0.2.4
  x25519: ^0.2.0
  ed25519_edwards: ^0.3.1

  # ============================================================================
  # STORAGE
  # ============================================================================
  flutter_secure_storage: ^9.0.0
  sqflite_sqlcipher: ^2.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # ============================================================================
  # NETWORKING
  # ============================================================================
  dio: ^5.4.0
  http: ^1.1.2
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^5.0.2
  web_socket_channel: ^2.4.0

  # ============================================================================
  # SECURITY
  # ============================================================================
  local_auth: ^2.1.8
  flutter_jailbreak_detection: ^1.10.0
  device_info_plus: ^9.1.1
  safe_device: ^2.0.1
  screenshot_callback: ^3.0.0

  # Certificate Pinning
  dio_certificate_pinning: ^1.0.3

  # ============================================================================
  # PERMISSIONS
  # ============================================================================
  permission_handler: ^11.1.0

  # ============================================================================
  # UTILITIES
  # ============================================================================
  uuid: ^4.2.1
  intl: ^0.19.0
  logger: ^2.0.2+1
  collection: ^1.18.0

  # ============================================================================
  # WEBRTC (for voice/avatar calls)
  # ============================================================================
  flutter_webrtc: ^0.9.48

  # ============================================================================
  # MEDIA
  # ============================================================================
  image_picker: ^1.0.7
  video_player: ^2.8.2
  camera: ^0.10.5+7

  # ============================================================================
  # QR CODE
  # ============================================================================
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # ============================================================================
  # PLATFORM
  # ============================================================================
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/najika/
    - assets/lottie/

  # Fonts (Gothic Lolita theme)
  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
        - asset: fonts/RobotoMono-Bold.ttf
          weight: 700

# Flavor configurations
flutter_flavors:
  flavors:
    private:
      app:
        name: "Najika (Private)"
      android:
        applicationId: "com.najika.digivice.private"
      ios:
        bundleId: "com.najika.digivice.private"

    friends:
      app:
        name: "Najika (Friends)"
      android:
        applicationId: "com.najika.digivice.friends"
      ios:
        bundleId: "com.najika.digivice.friends"

    public:
      app:
        name: "Najika"
      android:
        applicationId: "com.najika.digivice"
      ios:
        bundleId: "com.najika.digivice"
