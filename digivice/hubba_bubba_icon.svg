  <!-- Glanz-Effekt -->
  <ellipse cx="20" cy="22" rx="12" ry="8" fill="rgba(255,255,255,0.4)"/>

  <!-- Chat Symbol (Sprechblase) -->
  <path d="M 20 28 Q 20 24, 24 24 L 40 24 Q 44 24, 44 28 L 44 38 Q 44 42, 40 42 L 28 42 L 24 48 L 24 42 L 24 42 Q 20 42, 20 38 Z"
        fill="white" opacity="0.9"/>
