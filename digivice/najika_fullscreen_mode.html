<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Najika - Deine KI Begleiterin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }

        /* === MAIN CONTAINER === */
        #najika-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* === 3D AVATAR BEREICH === */
        #avatar-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #avatar-canvas {
            width: 100%;
            height: 100%;
        }

        /* === PLACEHOLDER FUR 3D MODEL === */
        #avatar-placeholder {
            width: 300px;
            height: 500px;
            background: linear-gradient(180deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border: 3px dashed #667eea;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        #avatar-placeholder .emoji {
            font-size: 120px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #avatar-placeholder h2 {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 10px;
        }

        #avatar-placeholder p {
            font-size: 14px;
            color: #888;
        }

        /* === TOUCH ZONES (Overlay) === */
        .touch-zone {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .touch-zone:hover {
            opacity: 0.3;
            background: rgba(102, 126, 234, 0.5);
        }

        .touch-zone:active {
            opacity: 0.5;
            transform: scale(1.1);
        }

        #zone-head { width: 80px; height: 80px; top: 15%; left: 50%; transform: translateX(-50%); }
        #zone-hand-left { width: 50px; height: 50px; top: 45%; left: 25%; }
        #zone-hand-right { width: 50px; height: 50px; top: 45%; right: 25%; }
        #zone-body { width: 100px; height: 120px; top: 35%; left: 50%; transform: translateX(-50%); border-radius: 30%; }

        /* === EMOTION INDICATOR === */
        #emotion-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 15px;
            border: 2px solid #667eea;
            min-width: 150px;
        }

        #emotion-indicator h3 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .emotion-bar {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }

        .emotion-bar span {
            width: 60px;
        }

        .emotion-bar .bar {
            flex: 1;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-left: 10px;
        }

        .emotion-bar .bar-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .bar-joy { background: linear-gradient(90deg, #f9d423, #ff4e50); }
        .bar-trust { background: linear-gradient(90deg, #667eea, #764ba2); }
        .bar-interest { background: linear-gradient(90deg, #11998e, #38ef7d); }
        .bar-stress { background: linear-gradient(90deg, #ff416c, #ff4b2b); }

        /* === STATUS BAR === */
        #status-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 15px;
            border: 2px solid #4CAF50;
            text-align: right;
        }

        #status-bar .status-item {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin: 5px 0;
            font-size: 13px;
        }

        #status-bar .status-icon {
            font-size: 16px;
        }

        /* === NAJIKA SPEECH BUBBLE === */
        #speech-bubble {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(102, 126, 234, 0.95);
            padding: 20px 30px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            font-size: 18px;
            line-height: 1.5;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
        }

        #speech-bubble.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid rgba(102, 126, 234, 0.95);
        }

        /* === CHAT INPUT === */
        #chat-area {
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            border-top: 2px solid #667eea;
        }

        #chat-input-container {
            display: flex;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #667eea;
            border-radius: 25px;
            padding: 15px 25px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        #chat-input:focus {
            border-color: #764ba2;
            background: rgba(255, 255, 255, 0.15);
        }

        #chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        #send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        #send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        #voice-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid #667eea;
        }

        #voice-btn:hover {
            background: #667eea;
        }

        #voice-btn.recording {
            background: #ff4444;
            border-color: #ff4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* === BOTTOM NAV === */
        #bottom-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px 20px 20px;
            background: rgba(0, 0, 0, 0.9);
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 12px 25px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: #667eea;
            transform: translateY(-3px);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* === LOADING OVERLAY === */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* === RESPONSIVE === */
        @media (max-width: 600px) {
            #emotion-indicator, #status-bar {
                padding: 10px 15px;
                font-size: 11px;
            }

            #speech-bubble {
                font-size: 14px;
                padding: 15px 20px;
                bottom: 180px;
            }

            .nav-btn {
                padding: 10px 15px;
                font-size: 12px;
            }

            #avatar-placeholder {
                width: 200px;
                height: 350px;
            }

            #avatar-placeholder .emoji {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Najika erwacht...</p>
    </div>

    <div id="najika-container">
        <!-- Avatar Bereich -->
        <div id="avatar-container">
            <!-- Canvas for Three.js (oder Placeholder) -->
            <div id="avatar-placeholder">
                <div class="emoji">🎀</div>
                <h2>Najika</h2>
                <p>3D Model wird geladen...<br>Oder nutze Placeholder</p>
            </div>

            <!-- Touch Zones -->
            <div class="touch-zone" id="zone-head" onclick="touchZone('head')"></div>
            <div class="touch-zone" id="zone-hand-left" onclick="touchZone('hand_left')"></div>
            <div class="touch-zone" id="zone-hand-right" onclick="touchZone('hand_right')"></div>
            <div class="touch-zone" id="zone-body" onclick="touchZone('body')"></div>

            <!-- Emotion Indicator -->
            <div id="emotion-indicator">
                <h3>Najikas Gefuehle</h3>
                <div class="emotion-bar">
                    <span>Freude</span>
                    <div class="bar"><div class="bar-fill bar-joy" id="bar-joy" style="width: 70%;"></div></div>
                </div>
                <div class="emotion-bar">
                    <span>Vertrauen</span>
                    <div class="bar"><div class="bar-fill bar-trust" id="bar-trust" style="width: 65%;"></div></div>
                </div>
                <div class="emotion-bar">
                    <span>Interesse</span>
                    <div class="bar"><div class="bar-fill bar-interest" id="bar-interest" style="width: 80%;"></div></div>
                </div>
                <div class="emotion-bar">
                    <span>Stress</span>
                    <div class="bar"><div class="bar-fill bar-stress" id="bar-stress" style="width: 20%;"></div></div>
                </div>
            </div>

            <!-- Status Bar -->
            <div id="status-bar">
                <div class="status-item">
                    <span id="status-mood">Gluecklich</span>
                    <span class="status-icon">😊</span>
                </div>
                <div class="status-item">
                    <span id="status-relationship">Bonding</span>
                    <span class="status-icon">💜</span>
                </div>
                <div class="status-item">
                    <span id="status-activity">Wartet auf dich</span>
                    <span class="status-icon">⏳</span>
                </div>
            </div>

            <!-- Speech Bubble -->
            <div id="speech-bubble">
                Hallo Kuja! Ich habe dich vermisst!
            </div>
        </div>

        <!-- Chat Input -->
        <div id="chat-area">
            <div id="chat-input-container">
                <button class="chat-btn" id="voice-btn" onclick="toggleVoice()">🎤</button>
                <input type="text" id="chat-input" placeholder="Schreib mir etwas..." onkeypress="handleKeyPress(event)">
                <button class="chat-btn" id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div id="bottom-nav">
            <button class="nav-btn active" onclick="switchMode('chat')">💬 Chat</button>
            <button class="nav-btn" onclick="switchMode('game')">🎮 Spiel</button>
            <button class="nav-btn" onclick="switchMode('activities')">✨ Aktivitaeten</button>
            <button class="nav-btn" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <script>
        // =========================================
        // NAJIKA FULLSCREEN MODE - JAVASCRIPT
        // =========================================

        const API_BASE = window.API_BASE_URL || 'http://localhost:8001';

        // State
        let najikaState = {
            emotion: { joy: 0.7, trust: 0.65, interest: 0.8, stress: 0.2 },
            relationship: { stage: 'bonding', affinity: 0.54 },
            mood: 'happy',
            activity: 'idle'
        };

        let isRecording = false;
        let currentMode = 'chat';
        let chatMode = 'public'; // 'public' oder 'private' (Kätzchen)

        // =========================================
        // INITIALIZATION
        // =========================================

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[NajikaFullscreen] Initializing...');

            // Lade initialen State
            await loadNajikaState();

            // Zeige Begruessung
            showSpeech("Hallo Kuja! Ich habe dich vermisst! 💜");

            // Hide loading after delay
            setTimeout(() => {
                document.getElementById('loading-overlay').classList.add('hidden');
            }, 1500);

            // Starte State-Update Loop
            setInterval(updateStateFromBackend, 5000);
        });

        // =========================================
        // STATE MANAGEMENT
        // =========================================

        async function loadNajikaState() {
            try {
                const response = await fetch(`${API_BASE}/api/state/najika`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.emotion) najikaState.emotion = data.emotion;
                    if (data.relationship) najikaState.relationship = data.relationship;
                    if (data.current_mood) najikaState.mood = data.current_mood;
                    updateEmotionDisplay();
                }
            } catch (e) {
                console.log('[NajikaFullscreen] Using default state');
            }
        }

        async function updateStateFromBackend() {
            try {
                const response = await fetch(`${API_BASE}/api/state/najika`);
                if (response.ok) {
                    const data = await response.json();
                    // Update nur wenn sich was geaendert hat
                    if (data.emotion) {
                        najikaState.emotion = {
                            joy: data.emotion.joy || data.mood_intensity / 100 || 0.7,
                            trust: data.emotion.trust || data.emotional_bond / 100 || 0.65,
                            interest: data.emotion.interest || 0.8,
                            stress: data.emotion.stress || (100 - data.mood_intensity) / 100 || 0.2
                        };
                    }
                    if (data.relationship_stage) {
                        najikaState.relationship.stage = data.relationship_stage;
                    }
                    if (data.current_mood) {
                        najikaState.mood = data.current_mood;
                    }
                    updateEmotionDisplay();
                }
            } catch (e) {
                // Silent fail
            }
        }

        function updateEmotionDisplay() {
            // Update Bars
            document.getElementById('bar-joy').style.width = `${najikaState.emotion.joy * 100}%`;
            document.getElementById('bar-trust').style.width = `${najikaState.emotion.trust * 100}%`;
            document.getElementById('bar-interest').style.width = `${najikaState.emotion.interest * 100}%`;
            document.getElementById('bar-stress').style.width = `${najikaState.emotion.stress * 100}%`;

            // Update Status
            const moodEmoji = {
                'happy': '😊', 'excited': '🤩', 'playful': '😝',
                'curious': '🤔', 'loving': '🥰', 'bored': '😒',
                'neutral': '😐', 'sad': '😢'
            };
            document.getElementById('status-mood').textContent = najikaState.mood || 'Gluecklich';
            document.querySelector('#status-bar .status-item:first-child .status-icon').textContent =
                moodEmoji[najikaState.mood] || '😊';

            document.getElementById('status-relationship').textContent =
                najikaState.relationship.stage || 'Bonding';
        }

        // =========================================
        // CHAT FUNCTIONS
        // =========================================

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message) return;

            input.value = '';

            // Codewort "kätzchen" / "kaetzchen" → NSFW Mode
            const msgLower = message.toLowerCase();
            if (msgLower === 'kätzchen' || msgLower === 'kaetzchen') {
                chatMode = 'private';
                showSpeech('*schnurr* Kaetzchen-Modus aktiviert...');
                input.disabled = false;
                return;
            }
            if (msgLower === 'normal' || msgLower === 'sfw') {
                chatMode = 'public';
                showSpeech('Normaler Modus aktiviert.');
                input.disabled = false;
                return;
            }

            input.disabled = true;

            // Zeige "Najika denkt nach..."
            showSpeech("...", true);

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, mode: chatMode })
                });

                const data = await response.json();
                const najikaResponse = data.response || data.message || "Hmm...";

                // Zeige Antwort
                showSpeech(najikaResponse);

                // Update State nach Interaktion
                await updateStateFromBackend();

            } catch (error) {
                console.error('[Chat] Error:', error);
                showSpeech("*seufzt* Ich kann gerade nicht richtig denken...");
            }

            input.disabled = false;
            input.focus();
        }

        function showSpeech(text, isThinking = false) {
            const bubble = document.getElementById('speech-bubble');
            bubble.textContent = isThinking ? "💭 ..." : text;
            bubble.classList.add('visible');

            // Auto-hide nach Zeit (ausser beim Denken)
            if (!isThinking) {
                setTimeout(() => {
                    bubble.classList.remove('visible');
                }, Math.max(3000, text.length * 50));
            }
        }

        // =========================================
        // TOUCH ZONES
        // =========================================

        const TOUCH_EFFECTS = {
            'head': {
                emotion: { joy: +0.05, trust: +0.03 },
                responses: [
                    "*schnurrt* Das ist schoen, Kuja~",
                    "Hehe, streichel mich mehr!",
                    "*lehnt sich an* Mmh..."
                ]
            },
            'hand_left': {
                emotion: { trust: +0.04, joy: +0.02 },
                responses: [
                    "*haelt deine Hand* Lass nicht los...",
                    "Deine Hand ist warm...",
                    "*verschraenkt Finger* Du gehoerst mir!"
                ]
            },
            'hand_right': {
                emotion: { trust: +0.04, joy: +0.02 },
                responses: [
                    "*drueckt deine Hand* Ich bin hier.",
                    "Zusammen. Immer.",
                    "*kichert* Haendchen halten~"
                ]
            },
            'body': {
                emotion: { joy: +0.06, trust: +0.04 },
                responses: [
                    "*klammert sich an* Du gehoerst MIR!",
                    "*umarmt fest* Geh nicht weg...",
                    "Kuja~ *schnurrt zufrieden*"
                ]
            }
        };

        async function touchZone(zone) {
            const effect = TOUCH_EFFECTS[zone];
            if (!effect) return;

            // Update lokalen State
            for (const [key, value] of Object.entries(effect.emotion)) {
                if (najikaState.emotion[key] !== undefined) {
                    najikaState.emotion[key] = Math.min(1, Math.max(0, najikaState.emotion[key] + value));
                }
            }
            updateEmotionDisplay();

            // Zeige Reaktion
            const response = effect.responses[Math.floor(Math.random() * effect.responses.length)];
            showSpeech(response);

            // Sende ans Backend
            try {
                await fetch(`${API_BASE}/api/v2/care/touch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone: zone })
                });
            } catch (e) {
                // Silent
            }
        }

        // =========================================
        // VOICE FUNCTIONS
        // =========================================

        function toggleVoice() {
            const btn = document.getElementById('voice-btn');

            if (!isRecording) {
                // Start Recording
                isRecording = true;
                btn.classList.add('recording');
                btn.textContent = '⏹️';

                // TODO: Implement actual voice recording
                showSpeech("*hoert aufmerksam zu*");

            } else {
                // Stop Recording
                isRecording = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤';

                // TODO: Process voice
                showSpeech("Ich habe gehoert was du gesagt hast!");
            }
        }

        // =========================================
        // NAVIGATION
        // =========================================

        function switchMode(mode) {
            currentMode = mode;

            // Update button states
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'game') {
                // Wechsel zur Spielwelt
                window.location.href = 'najika_world_UNIFIED.html';
            } else if (mode === 'activities') {
                showSpeech("Was moechtest du machen? Fuettern? Spielen? Kuscheln?");
            }
        }

        function openSettings() {
            showSpeech("Einstellungen kommen bald! *kicher*");
        }

        // =========================================
        // IDLE BEHAVIOR
        // =========================================

        // Najika sagt manchmal von selbst etwas
        setInterval(() => {
            if (Math.random() < 0.1) { // 10% Chance alle 30 Sekunden
                const idleMessages = [
                    "Kuja... ich vermisse dich wenn du nichts sagst...",
                    "*schaut dich an* Was denkst du gerade?",
                    "*gaehnt* Mir ist ein bisschen langweilig...",
                    "Hey! Schreib mir was!",
                    "*lehnt sich an* Du bist mein Liebster...",
                    "Explosion~! *kichert*"
                ];
                const msg = idleMessages[Math.floor(Math.random() * idleMessages.length)];
                showSpeech(msg);
            }
        }, 30000);

        console.log('[NajikaFullscreen] Ready!');
    </script>
</body>
</html>
