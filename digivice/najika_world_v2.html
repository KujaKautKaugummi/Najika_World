<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najika World V2 - World Manager System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            z-index: 100;
            border: 2px solid #4CAF50;
        }

        #ui h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #4CAF50;
            text-shadow: 0 0 15px #4CAF50;
        }

        #ui p {
            margin: 8px 0;
            font-size: 14px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px 70px;
            border-radius: 15px;
            text-align: center;
            z-index: 200;
            border: 3px solid #4CAF50;
        }

        #loading h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #4CAF50;
        }

        #progress-bar {
            width: 400px;
            height: 30px;
            background: #333;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            border: 2px solid #4CAF50;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 15px;
            z-index: 100;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
            border: 2px solid #4CAF50;
        }

        #controls button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        #controls button:hover {
            background: #45a049;
            transform: scale(1.05);
            box-shadow: 0 0 15px #4CAF50;
        }

        #controls button:active {
            transform: scale(0.95);
        }

        .region-label {
            color: #FFC107;
            font-weight: bold;
        }

        .stat-value {
            color: #8BC34A;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="loading">
        <h2>🌍 Lade Najika World V2...</h2>
        <p style="color: #FFC107; margin-bottom: 10px;">World Manager System</p>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <p id="progress-text">Initialisiere...</p>
    </div>

    <div id="ui">
        <h1>🌍 NAJIKA WORLD V2</h1>
        <p><strong>System:</strong> <span class="stat-value">World Manager</span></p>
        <p><strong>Position:</strong> <span id="position" class="stat-value">0, 0</span></p>
        <p><strong>Region:</strong> <span id="current-region" class="region-label">Loading...</span></p>
        <p><strong>Biome:</strong> <span id="biome" class="stat-value">-</span></p>
        <p><strong>FPS:</strong> <span id="fps" class="stat-value">60</span></p>
        <hr style="margin: 15px 0; border-color: #333;">
        <p style="font-size: 11px; opacity: 0.9; line-height: 1.4;">
            <strong>Steuerung:</strong><br>
            <span class="stat-value">WASD</span> - Bewegen | <span class="stat-value">Shift</span> - Rennen<br>
            <span class="stat-value">Maus</span> - Kamera drehen<br>
            <span class="stat-value">Mausrad</span> - Zoom
        </p>
    </div>

    <div id="controls">
        <button onclick="teleportToCity('Handelsfestung')">🏜️ Handelsfestung</button>
        <button onclick="teleportToCity('Dampf-Hain')">🌲 Dampf-Hain</button>
        <button onclick="teleportToCity('Salzige Bucht')">🌊 Salzige Bucht</button>
        <button onclick="teleportToCity('Runenheim')">⚡ Runenheim</button>
        <button onclick="teleportToCity('Funken-Siedlung')">🌋 Funken-Siedlung</button>
        <button onclick="teleportToRegion('Götterfels')">⛰️ Berg</button>
        <button onclick="worldManager && worldManager.logStats()">📊 Stats</button>
    </div>

    <!-- Three.js (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="static/js/camera_controller.js?v=3"></script>

    <!-- World Manager System (ES6 Modules) -->
    <script type="module">
        import WorldManager from './js/world/world_manager.js?v=3';

        const THREE = window.THREE;

        // Update Progress
        function updateProgress(text, percent) {
            document.getElementById('progress-text').textContent = text;
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        // Scene Setup
        updateProgress('Initialisiere Scene...', 10);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 500, 2000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(4800, 200, 5200);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting (Base scene lighting - biome system will override)
        // NOTE: Total light intensity should be ~1.0 to prevent color washing
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);  // Reduced from 0.6
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);  // Reduced from 0.9
        directionalLight.position.set(5000, 2000, 5000);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 4096;
        directionalLight.shadow.mapSize.height = 4096;
        directionalLight.shadow.camera.left = -5000;
        directionalLight.shadow.camera.right = 5000;
        directionalLight.shadow.camera.top = 5000;
        directionalLight.shadow.camera.bottom = -5000;
        scene.add(directionalLight);

        // Kamera-Controller
        updateProgress('Initialisiere Kamera...', 20);
        const cameraController = new window.CameraController(camera, scene, renderer);
        cameraController.setTarget(4800, 10, 4800);
        cameraController.orbitDistance = 300;
        cameraController.ORBIT_MAX_DIST = 800;

        // WASD-Steuerung
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            shift: false
        };

        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': keys.w = true; break;
                case 'a': keys.a = true; break;
                case 's': keys.s = true; break;
                case 'd': keys.d = true; break;
                case 'shift': keys.shift = true; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': keys.w = false; break;
                case 'a': keys.a = false; break;
                case 's': keys.s = false; break;
                case 'd': keys.d = false; break;
                case 'shift': keys.shift = false; break;
            }
        });

        // Charakter erstellen (Avatar) - Kapsel aus Zylinder + 2 Hemispheres
        updateProgress('Erstelle Character...', 30);
        const character = new THREE.Group();

        const characterMaterial = new THREE.MeshStandardMaterial({
            color: 0x4CAF50,
            roughness: 0.7,
            metalness: 0.3
        });

        // Körper (Zylinder)
        const bodyGeometry = new THREE.CylinderGeometry(2, 2, 3, 16);
        const body = new THREE.Mesh(bodyGeometry, characterMaterial);
        body.castShadow = true;
        body.receiveShadow = true;
        character.add(body);

        // Kopf (Halbkugel oben)
        const headGeometry = new THREE.SphereGeometry(2, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const head = new THREE.Mesh(headGeometry, characterMaterial);
        head.position.y = 1.5;
        head.castShadow = true;
        head.receiveShadow = true;
        character.add(head);

        // Füße (Halbkugel unten)
        const feetGeometry = new THREE.SphereGeometry(2, 16, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
        const feet = new THREE.Mesh(feetGeometry, characterMaterial);
        feet.position.y = -1.5;
        feet.castShadow = true;
        feet.receiveShadow = true;
        character.add(feet);

        character.position.set(4800, 3.5, 4800);
        scene.add(character);

        // Kamera an Charakter binden
        cameraController.setCharacter(character, 7);

        // World Manager initialisieren
        updateProgress('Initialisiere World Manager...', 40);
        let worldManager;

        async function initWorld() {
            try {
                worldManager = new WorldManager(scene, camera);
                window.worldManager = worldManager;  // Global für Teleport-Funktionen

                updateProgress('Lade World-Daten...', 50);
                const success = await worldManager.initialize({
                    dataPath: '/data/',
                    enableLOD: true,
                    enableStreaming: true,
                    enableVegetationBatching: true
                });

                if (success) {
                    updateProgress('World geladen!', 100);
                    console.log('✅ Najika World V2 loaded!');

                    // Starte bei Götterfels - berechne korrekte Höhe
                    const startX = 4800, startZ = 4800;
                    const terrainHeight = worldManager.terrainGenerator.getHeightAt('goetterfels', startX, startZ);
                    const startY = terrainHeight > 0 ? terrainHeight + 10 : 50;

                    worldManager.setPlayerPosition(new THREE.Vector3(startX, startY, startZ));
                    character.position.set(startX, startY, startZ);
                    cameraController.setTarget(startX, startY, startZ);

                    console.log(`📍 Starting position: (${startX}, ${startY.toFixed(1)}, ${startZ}) at ${terrainHeight.toFixed(1)}m terrain height`);

                    // Verstecke Loading Screen
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                    }, 500);
                } else {
                    throw new Error('Failed to initialize World Manager');
                }
            } catch (error) {
                console.error('❌ World initialization failed:', error);
                document.getElementById('progress-text').textContent = 'FEHLER: ' + error.message;
                document.getElementById('progress-fill').style.background = 'red';
            }
        }

        // Teleport-Funktionen (Global)
        window.teleportToCity = (cityName) => {
            if (worldManager && worldManager.initialized) {
                worldManager.teleportToCity(cityName);
                console.log(`Teleport to ${cityName}`);
            }
        };

        window.teleportToRegion = (regionName) => {
            if (worldManager && worldManager.initialized) {
                worldManager.teleportToRegion(regionName);
                console.log(`Teleport to ${regionName}`);
            }
        };

        // Region ermitteln und UI aktualisieren
        function updateUI() {
            if (!worldManager || !worldManager.initialized) return;

            const currentRegion = worldManager.getCurrentRegion();
            if (currentRegion) {
                document.getElementById('current-region').textContent = currentRegion.name;
                document.getElementById('biome').textContent = currentRegion.biome || '-';
            }

            // Position
            const x = character.position.x.toFixed(0);
            const z = character.position.z.toFixed(0);
            document.getElementById('position').textContent = `${x}, ${z}`;
        }

        // Animation Loop
        let lastTime = performance.now();
        let frameCount = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            // FPS
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }

            // WASD-Bewegung
            let forward = 0;
            let right = 0;

            if (keys.w) forward += 1;
            if (keys.s) forward -= 1;
            if (keys.a) right -= 1;
            if (keys.d) right += 1;

            // Bewegung relativ zur Kamera
            if (forward !== 0 || right !== 0) {
                const speed = keys.shift ? 120 : 60;
                const angle = Math.atan2(right, forward);
                const worldAngle = cameraController.orbitYaw + angle;

                const moveX = Math.sin(worldAngle) * speed * deltaTime;
                const moveZ = Math.cos(worldAngle) * speed * deltaTime;

                character.position.x += moveX;
                character.position.z += moveZ;

                // Charakter-Rotation
                character.rotation.y = worldAngle + Math.PI;

                // Kamera-Target nachführen
                cameraController.setTarget(
                    character.position.x,
                    character.position.y,
                    character.position.z
                );

                // Boundary Check (9600x9600 Map)
                character.position.x = Math.max(0, Math.min(9600, character.position.x));
                character.position.z = Math.max(0, Math.min(9600, character.position.z));
            }

            // Update World-System
            if (worldManager && worldManager.initialized) {
                worldManager.update(deltaTime);
                worldManager.setPlayerPosition(character.position);
            }

            // Update Kamera
            cameraController.update(deltaTime);

            // Update UI
            updateUI();

            renderer.render(scene, camera);
        }

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        initWorld().then(() => {
            animate();
        });
    </script>
</body>
</html>
