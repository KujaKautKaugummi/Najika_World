<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najika World - 9 Regions Test (Flat Build Mode)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            max-width: 350px;
            z-index: 100;
        }

        #ui h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #4CAF50;
            text-shadow: 0 0 10px #4CAF50;
        }

        #ui p {
            margin: 8px 0;
            font-size: 14px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;
            z-index: 200;
        }

        #loading h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #4CAF50;
        }

        #progress-bar {
            width: 300px;
            height: 25px;
            background: #333;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #controls button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }

        #controls button:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        #controls button:active {
            transform: scale(0.95);
        }

        .region-label {
            color: #FFC107;
            font-weight: bold;
        }

        #minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #4CAF50;
            border-radius: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="loading">
        <h2>🌍 Lade Najika World...</h2>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <p id="progress-text">Initialisiere...</p>
    </div>

    <div id="ui">
        <h1>🌍 NAJIKA WORLD</h1>
        <p><strong>Kamera-Modus:</strong> <span id="camera-mode" class="region-label">ORBIT</span></p>
        <p><strong>Position:</strong> <span id="position">0, 0</span></p>
        <p><strong>Gebiet:</strong> <span id="current-region" class="region-label">-</span></p>
        <p><strong>Geladene Assets:</strong> <span id="asset-count">0</span></p>
        <p><strong>FPS:</strong> <span id="fps">60</span></p>
        <hr style="margin: 15px 0; border-color: #333;">
        <p style="font-size: 12px; opacity: 0.8;">
            <strong>Gebiete:</strong><br>
            🏜️ Oasis (Südwest)<br>
            🏰 Dungeon (Nordwest)<br>
            🏛️ Medieval (Nordost)<br>
            🌲 Nature (Südost)
        </p>
    </div>

    <canvas id="minimap"></canvas>

    <div id="controls">
        <button onclick="switchCameraMode()">📷 Kamera</button>
        <button onclick="teleportTo('oasis')">🏜️ Oasis</button>
        <button onclick="teleportTo('dungeon')">🏰 Dungeon</button>
        <button onclick="teleportTo('medieval')">🏛️ Medieval</button>
        <button onclick="teleportTo('nature')">🌲 Nature</button>
        <button onclick="teleportTo('center')">🎯 Zentrum</button>
        <button onclick="toggleGrid()">📐 Grid</button>
    </div>

    <!-- Three.js und eigene Skripte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="static/js/camera_controller.js"></script>

    <script>
        const THREE = window.THREE;

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Himmelblau
        scene.fog = new THREE.Fog(0x87CEEB, 100, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Kamera-Controller
        const cameraController = new CameraController(camera, scene, renderer);
        cameraController.setTarget(0, 5, 0);
        cameraController.orbitDistance = 50;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 100);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 4096;
        directionalLight.shadow.mapSize.height = 4096;
        directionalLight.shadow.camera.left = -150;
        directionalLight.shadow.camera.right = 150;
        directionalLight.shadow.camera.top = 150;
        directionalLight.shadow.camera.bottom = -150;
        scene.add(directionalLight);

        // 9 REGIONS (3x3 Grid, each ~66x66)
        const regionSize = 66.66;
        const regions = [
            // Row 1 (top): z=66
            { name: 'ice',      color: 0xf0f8ff, x: -66.66, z: 66.66,  y: 0 },
            { name: 'highland', color: 0x8b7355, x: 0,      z: 66.66,  y: 0 },
            { name: 'desert',   color: 0xe8d4a0, x: 66.66,  z: 66.66,  y: 0 },
            // Row 2 (middle): z=0
            { name: 'swamp',    color: 0x556b2f, x: -66.66, z: 0,      y: 0 },
            { name: 'mountain', color: 0x808080, x: 0,      z: 0,      y: 5 },  // Berg höher!
            { name: 'coast',    color: 0xc2b280, x: 66.66,  z: 0,      y: 0 },
            // Row 3 (bottom): z=-66
            { name: 'caves',    color: 0x2f2f2f, x: -66.66, z: -66.66, y: 0 },
            { name: 'forest',   color: 0x2d5016, x: 0,      z: -66.66, y: 0 },
            { name: 'volcano',  color: 0x8b4513, x: 66.66,  z: -66.66, y: 0 }
        ];

        regions.forEach(region => {
            const geometry = new THREE.PlaneGeometry(regionSize, regionSize, 20, 20);
            const material = new THREE.MeshStandardMaterial({
                color: region.color,
                roughness: 0.9,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(region.x, region.y, region.z);
            mesh.receiveShadow = true;
            mesh.name = `region_${region.name}`;
            scene.add(mesh);
        });

        // Grid
        const gridHelper = new THREE.GridHelper(200, 40, 0x000000, 0x444444);
        gridHelper.visible = true;
        scene.add(gridHelper);

        // Gebietsgrenzen visualisieren
        function createRegionMarker(x, z, color, label) {
            const markerGeometry = new THREE.BoxGeometry(2, 10, 2);
            const markerMaterial = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
            const marker = new THREE.Mesh(markerGeometry, markerMaterial);
            marker.position.set(x, 5, z);
            marker.castShadow = true;
            scene.add(marker);

            // Text-Sprite (simuliert mit einer Plane)
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(label, 128, 75);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.set(x, 15, z);
            sprite.scale.set(20, 10, 1);
            scene.add(sprite);
        }

        // Regionen markieren
        createRegionMarker(-50, -50, '#FFA500', 'OASIS');      // Südwest
        createRegionMarker(-50, 50, '#8B0000', 'DUNGEON');     // Nordwest
        createRegionMarker(50, 50, '#4169E1', 'MEDIEVAL');     // Nordost
        createRegionMarker(50, -50, '#228B22', 'NATURE');      // Südost

        // Asset Loading
        const gltfLoader = new THREE.GLTFLoader();
        const loadedAssets = [];
        let totalAssets = 0;
        let loadedCount = 0;

        // Assets für jedes Gebiet
        const regionAssets = {
            // OASIS (Südwest: -100 bis 0, -100 bis 0)
            oasis: [
                { path: 'static/assets/jellysquish/oasis/palm_l.glb', name: 'Palm Large', position: [-70, 0, -70], scale: 1.5 },
                { path: 'static/assets/jellysquish/oasis/palm_m.glb', name: 'Palm Medium', position: [-60, 0, -60], scale: 1.2 },
                { path: 'static/assets/jellysquish/oasis/palm_s.glb', name: 'Palm Small', position: [-50, 0, -50], scale: 1 },
                { path: 'static/assets/jellysquish/oasis/cactus_large.glb', name: 'Cactus Large', position: [-80, 0, -60], scale: 1.2 },
                { path: 'static/assets/jellysquish/oasis/cactus_small.glb', name: 'Cactus Small', position: [-75, 0, -55], scale: 1 },
                { path: 'static/assets/jellysquish/oasis/house_large.glb', name: 'House Large', position: [-65, 0, -75], scale: 1 },
                { path: 'static/assets/jellysquish/oasis/house_small.glb', name: 'House Small', position: [-55, 0, -80], scale: 0.8 },
                { path: 'static/assets/jellysquish/oasis/rocks_1.glb', name: 'Rocks 1', position: [-85, 0, -85], scale: 1 },
                { path: 'static/assets/jellysquish/oasis/rocks_2.glb', name: 'Rocks 2', position: [-45, 0, -45], scale: 1 },
                { path: 'static/assets/jellysquish/oasis/chest.glb', name: 'Treasure Chest', position: [-70, 0, -50], scale: 1 },
                { path: 'static/assets/jellysquish/oasis/pot_l.glb', name: 'Pot Large', position: [-60, 0, -70], scale: 1 },
                { path: 'static/assets/jellysquish/oasis/pot_s.glb', name: 'Pot Small', position: [-65, 0, -68], scale: 0.8 },
                // Mehr Oasis Dekoration
                { path: 'static/assets/jellysquish/oasis/palm_l.glb', name: 'Palm Large 2', position: [-90, 0, -50], scale: 1.3 },
                { path: 'static/assets/jellysquish/oasis/palm_m.glb', name: 'Palm Medium 2', position: [-50, 0, -90], scale: 1.1 },
                { path: 'static/assets/jellysquish/oasis/cactus_large.glb', name: 'Cactus Large 2', position: [-70, 0, -90], scale: 1.1 },
                { path: 'static/assets/jellysquish/oasis/rocks_3.glb', name: 'Rocks 3', position: [-55, 0, -65], scale: 1 },
            ],

            // DUNGEON (Nordwest: -100 bis 0, 0 bis 100)
            dungeon: [
                { path: 'static/assets/kaykit/dungeon/chest.gltf', name: 'Chest', position: [-70, 0, 70], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/torch.gltf', name: 'Torch 1', position: [-65, 0, 65], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/torch.gltf', name: 'Torch 2', position: [-75, 0, 65], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/banner_red.gltf', name: 'Banner Red', position: [-80, 0, 80], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/banner_blue.gltf', name: 'Banner Blue', position: [-60, 0, 80], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/barrel.gltf', name: 'Barrel', position: [-70, 0, 60], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/wall.gltf', name: 'Wall 1', position: [-85, 0, 70], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/wall.gltf', name: 'Wall 2', position: [-85, 0, 75], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/wall.gltf', name: 'Wall 3', position: [-85, 0, 80], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/floor_tile_big.gltf', name: 'Floor Tile 1', position: [-70, 0, 75], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/floor_tile_big.gltf', name: 'Floor Tile 2', position: [-60, 0, 75], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/column.gltf', name: 'Column 1', position: [-55, 0, 70], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/column.gltf', name: 'Column 2', position: [-55, 0, 85], scale: 1 },
                // Mehr Dungeon Dekoration
                { path: 'static/assets/kaykit/dungeon/banner_green.gltf', name: 'Banner Green', position: [-50, 0, 70], scale: 1 },
                { path: 'static/assets/kaykit/dungeon/banner_brown.gltf', name: 'Banner Brown', position: [-90, 0, 60], scale: 1 },
            ],

            // MEDIEVAL (Nordost: 0 bis 100, 0 bis 100)
            medieval: [
                { path: 'static/assets/kaykit/medieval/building_grain.gltf', name: 'Grain Building', position: [70, 0, 70], scale: 1 },
                { path: 'static/assets/kaykit/medieval/building_archeryrange_blue.gltf', name: 'Archery Range', position: [60, 0, 80], scale: 1 },
                { path: 'static/assets/kaykit/medieval/building_blacksmith_blue.gltf', name: 'Blacksmith', position: [80, 0, 60], scale: 1 },
                { path: 'static/assets/kaykit/medieval/building_barracks_red.gltf', name: 'Barracks', position: [50, 0, 50], scale: 1 },
                { path: 'static/assets/kaykit/medieval/barrel.gltf', name: 'Barrel 1', position: [65, 0, 65], scale: 1 },
                { path: 'static/assets/kaykit/medieval/barrel.gltf', name: 'Barrel 2', position: [67, 0, 65], scale: 1 },
                { path: 'static/assets/kaykit/medieval/bucket_empty.gltf', name: 'Bucket', position: [75, 0, 75], scale: 1 },
                // Mehr Medieval Dekoration
                { path: 'static/assets/kaykit/medieval/building_archeryrange_green.gltf', name: 'Archery Range 2', position: [85, 0, 85], scale: 1 },
                { path: 'static/assets/kaykit/medieval/building_barracks_yellow.gltf', name: 'Barracks 2', position: [55, 0, 90], scale: 1 },
            ],

            // NATURE (Südost: 0 bis 100, -100 bis 0)
            nature: [
                { path: 'static/assets/kaykit/nature/Tree_4_B_Color1.gltf', name: 'Oak Tree', position: [70, 0, -70], scale: 1.5 },
                { path: 'static/assets/kaykit/nature/Tree_3_A_Color1.gltf', name: 'Pine Tree', position: [60, 0, -60], scale: 1.3 },
                { path: 'static/assets/kaykit/nature/Tree_2_B_Color1.gltf', name: 'Birch Tree', position: [80, 0, -80], scale: 1.4 },
                { path: 'static/assets/kaykit/nature/Rock_2_C_Color1.gltf', name: 'Rock 1', position: [75, 0, -65], scale: 1 },
                { path: 'static/assets/kaykit/nature/Rock_1_A_Color1.gltf', name: 'Rock 2', position: [65, 0, -75], scale: 1.2 },
                { path: 'static/assets/kaykit/nature/Bush_1_A_Color1.gltf', name: 'Bush 1', position: [55, 0, -55], scale: 1 },
                { path: 'static/assets/kaykit/nature/Bush_1_B_Color1.gltf', name: 'Bush 2', position: [85, 0, -55], scale: 1 },
                { path: 'static/assets/kaykit/nature/Bush_2_A_Color1.gltf', name: 'Bush 3', position: [50, 0, -85], scale: 1 },
                // Mehr Nature Dekoration
                { path: 'static/assets/kaykit/nature/Tree_1_C_Color1.gltf', name: 'Tree 4', position: [90, 0, -50], scale: 1.2 },
                { path: 'static/assets/kaykit/nature/Tree_2_A_Color1.gltf', name: 'Tree 5', position: [50, 0, -70], scale: 1.3 },
                { path: 'static/assets/kaykit/nature/Rock_3_A_Color1.gltf', name: 'Rock 3', position: [60, 0, -90], scale: 1.1 },
                { path: 'static/assets/kaykit/nature/Bush_3_A_Color1.gltf', name: 'Bush 4', position: [70, 0, -85], scale: 1 },
            ],
        };

        // Alle Assets zählen
        for (const region in regionAssets) {
            totalAssets += regionAssets[region].length;
        }

        // Progress Update
        function updateProgress() {
            const percent = (loadedCount / totalAssets * 100).toFixed(0);
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('progress-text').textContent = `${loadedCount} / ${totalAssets} Assets geladen (${percent}%)`;
            document.getElementById('asset-count').textContent = loadedCount;
        }

        // Asset Loading Funktion
        async function loadAsset(asset) {
            try {
                const gltf = await new Promise((resolve, reject) => {
                    gltfLoader.load(asset.path, resolve, undefined, reject);
                });

                const model = gltf.scene;
                model.position.set(...asset.position);
                model.scale.set(asset.scale, asset.scale, asset.scale);
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(model);

                loadedAssets.push({ name: asset.name, model: model });
                loadedCount++;
                updateProgress();

                console.log(`✅ Loaded: ${asset.name}`);
            } catch (error) {
                console.error(`❌ Failed to load: ${asset.name}`, error);
                loadedCount++;
                updateProgress();
            }
        }

        // Alle Assets laden
        async function loadAllAssets() {
            updateProgress();

            for (const region in regionAssets) {
                for (const asset of regionAssets[region]) {
                    await loadAsset(asset);
                }
            }

            // Loading Screen ausblenden
            document.getElementById('loading').style.display = 'none';
            console.log('🎉 Alle Assets geladen!');
        }

        // Start loading
        loadAllAssets();

        // Teleport Funktionen
        const regionPositions = {
            oasis: { x: -70, z: -70 },
            dungeon: { x: -70, z: 70 },
            medieval: { x: 70, z: 70 },
            nature: { x: 70, z: -70 },
            center: { x: 0, z: 0 }
        };

        window.teleportTo = (region) => {
            const pos = regionPositions[region];
            if (pos) {
                camera.position.set(pos.x, 50, pos.z + 50);
                cameraController.setTarget(pos.x, 5, pos.z);
                updateCurrentRegion();
            }
        };

        // Aktuelles Gebiet ermitteln
        function updateCurrentRegion() {
            const x = camera.position.x;
            const z = camera.position.z;

            let region = 'Zentrum';
            if (x < 0 && z < 0) region = '🏜️ Oasis';
            else if (x < 0 && z >= 0) region = '🏰 Dungeon';
            else if (x >= 0 && z >= 0) region = '🏛️ Medieval';
            else if (x >= 0 && z < 0) region = '🌲 Nature';

            document.getElementById('current-region').textContent = region;
        }

        // Kamera-Modus wechseln
        window.switchCameraMode = () => {
            const modes = [
                cameraController.MODES.ORBIT,
                cameraController.MODES.THIRD,
                cameraController.MODES.FIRST
            ];
            const currentIndex = modes.indexOf(cameraController.getMode());
            const nextIndex = (currentIndex + 1) % modes.length;
            const nextMode = modes[nextIndex];

            cameraController.setMode(nextMode);
            document.getElementById('camera-mode').textContent = nextMode.toUpperCase();
        };

        // Grid Toggle
        window.toggleGrid = () => {
            gridHelper.visible = !gridHelper.visible;
        };

        // Animation Loop
        let lastTime = performance.now();
        let frameCount = 0;

        function animate() {
            requestAnimationFrame(animate);

            // FPS Counter
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }

            // Update Kamera
            const delta = 0.016;
            cameraController.update(delta);

            // Update UI
            const x = camera.position.x.toFixed(1);
            const z = camera.position.z.toFixed(1);
            document.getElementById('position').textContent = `${x}, ${z}`;
            updateCurrentRegion();

            renderer.render(scene, camera);
        }

        animate();

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start in der Mitte
        teleportTo('center');
    </script>
</body>
</html>
