openapi: 3.0.3
info:
  title: Najika API
  description: |
    Complete backend API for Najika World ecosystem.

    ## Features
    - 🔐 JWT Authentication
    - 🎮 Game Systems (Combat, Inventory, Quests)
    - 🤖 AI Training (LoRA, Sessions, Code)
    - 🎤 Voice (Whisper AI, Edge TTS, WebSocket)
    - ⚙️ Admin (User Management, Monitoring)

    ## Base URL
    - Development: `http://localhost:8000`
    - Production: `https://api.najika.world`

  version: 4.0.0
  contact:
    name: Najika World
    url: https://najika.world
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.najika.world
    description: Production server

tags:
  - name: Authentication
    description: User authentication and JWT tokens
  - name: Game
    description: Game systems (combat, inventory, quests)
  - name: Training
    description: AI training job management
  - name: Voice
    description: Voice chat, STT, and TTS
  - name: Admin
    description: Admin-only endpoints

paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: testuser
                password:
                  type: string
                  format: password
                  example: password123
                email:
                  type: string
                  format: email
                  example: test@example.com
                display_name:
                  type: string
                  example: Test User
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Username already exists

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user info
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/game/character/create:
    post:
      tags: [Game]
      summary: Create new character
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: MyDigimon
                species:
                  type: string
                  example: Jellysquish
                  default: Jellysquish
                nickname:
                  type: string
                  example: Jelly
      responses:
        '200':
          description: Character created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'

  /api/game/character:
    get:
      tags: [Game]
      summary: Get user's character
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Character data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'

  /api/game/combat/action:
    post:
      tags: [Game]
      summary: Execute combat action
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [attack, dodge, block, parry, skill]
                enemy_id:
                  type: string
                skill_id:
                  type: string
      responses:
        '200':
          description: Combat result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombatResult'

  /api/game/inventory:
    get:
      tags: [Game]
      summary: Get inventory
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Inventory items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItem'

  /api/training/jobs:
    get:
      tags: [Training]
      summary: List training jobs
      security:
        - BearerAuth: []
      parameters:
        - name: status_filter
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of training jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingJob'

    post:
      tags: [Training]
      summary: Create training job
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_name, training_type]
              properties:
                job_name:
                  type: string
                  example: LoRA Training - Weekly
                training_type:
                  type: string
                  enum: [lora, session, code, voice, personality]
                description:
                  type: string
                config:
                  type: object
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJob'

  /api/training/jobs/{job_id}/start:
    post:
      tags: [Training]
      summary: Start training job
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/voice/transcribe:
    post:
      tags: [Voice]
      summary: Transcribe audio (Whisper AI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audio_base64]
              properties:
                audio_base64:
                  type: string
                  description: Base64 encoded audio (WAV/MP3)
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transcription:
                    type: string
                  language:
                    type: string

  /api/voice/tts:
    post:
      tags: [Voice]
      summary: Text-to-Speech (Edge TTS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: EXPLOSION!
                language:
                  type: string
                  default: de
      responses:
        '200':
          description: Generated audio
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  audio_base64:
                    type: string
                  format:
                    type: string
                    example: mp3
                  personality:
                    type: string
                    example: megumin

  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Get system statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users:
                    type: integer
                  active_users:
                    type: integer
                  total_characters:
                    type: integer
                  total_training_jobs:
                    type: integer
                  running_training_jobs:
                    type: integer

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        user_id:
          type: integer
        username:
          type: string
        display_name:
          type: string

    Character:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        species:
          type: string
        level:
          type: integer
        stats:
          type: object
        status:
          type: object
        position:
          type: object

    CombatResult:
      type: object
      properties:
        success:
          type: boolean
        damage:
          type: integer
        player_health:
          type: number
        enemy_health:
          type: number
        message:
          type: string
        loot:
          type: array
          items:
            type: object
        xp_gained:
          type: integer

    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: string
        item_type:
          type: string
        name:
          type: string
        quantity:
          type: integer
        quality:
          type: number

    TrainingJob:
      type: object
      properties:
        id:
          type: integer
        job_name:
          type: string
        training_type:
          type: string
        status:
          type: string
        progress:
          type: number
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
