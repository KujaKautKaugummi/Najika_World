# Najika World - Docker Compose Configuration
# Complete production-ready setup

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: najika_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: najika_world
      POSTGRES_USER: najika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U najika"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - najika_network

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: najika_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - najika_network

  # ============================================================================
  # Backend API
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: najika_backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://najika:${POSTGRES_PASSWORD:-changeme}@postgres:5432/najika_world

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0

      # API Settings
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 4
      DEBUG: "false"

      # Security
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret-change-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}

      # AI/Training
      TRAINING_DATA_DIR: /app/data/training
      MODEL_OUTPUT_DIR: /app/models
      WHISPER_MODEL: base
      TTS_ENGINE: piper

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - najika_network

  # ============================================================================
  # Frontend (Nginx)
  # ============================================================================
  frontend:
    image: nginx:alpine
    container_name: najika_frontend
    restart: unless-stopped
    volumes:
      - ./digivice:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - najika_network

  # ============================================================================
  # Celery Worker (for background tasks)
  # ============================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: najika_celery
    restart: unless-stopped
    command: celery -A backend.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://najika:${POSTGRES_PASSWORD:-changeme}@postgres:5432/najika_world
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    networks:
      - najika_network

  # ============================================================================
  # Celery Beat (for scheduled tasks)
  # ============================================================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: najika_beat
    restart: unless-stopped
    command: celery -A backend.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://najika:${POSTGRES_PASSWORD:-changeme}@postgres:5432/najika_world
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - najika_network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  najika_network:
    driver: bridge
